site_name: AI活用マニュアル
site_description: AIツール（チャットAI・コーディングAI・保管庫系ツール）を体系的に整理する個人用ナレッジベース
site_author: 大輝
site_url: https://daifuk00003-alt.github.io/ai-manual/

repo_url: https://github.com/daifuk00003-alt/ai-manual
repo_name: daifuk00003-alt/ai-manual

theme:
  name: material
  language: ja
  icon:
    logo: material/robot-happy
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daifuk00003-alt/ai-manual
      name: GitHubリポジトリ

nav:
  - ホーム: index.md
  - 用語集: glossary/index.md
  - ツール別基礎編:
      - ツール別基礎編について: tools/index.md
      - ChatGPT: tools/chatgpt.md
      - Gemini: tools/gemini.md
      - Claude:
          - Claude（チャット）: tools/claude-chat.md
          - Claude（Cowork）: tools/claude-cowork.md
          - Claude（Code）: tools/claude-code.md
      - Codex: tools/codex.md
      - NotebookLM: tools/notebooklm.md
      - Obsidian等の保管庫系ツール: tools/obsidian.md
  - 応用編: advanced/index.md
  - 気になる欄: curious/index.md
  - トレンド・更新ログ: updates/index.md
